<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fff8e9">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='.9em' font-size='58'%3E💗%3C/text%3E%3C/svg%3E">
    <title>想卢宝了</title>
    <style>
        :root {
            --paper: #fffdf5;
            --paper-deep: #fff4d8;
            --ink: #4b321f;
            --ink-soft: #7b5a3c;
            --tiger: #f5b94c;
            --tiger-light: #ffd985;
            --cream: #fff8df;
            --sea: #7bd0e7;
            --sea-deep: #46abc9;
            --sand: #ffe7a8;
            --pink: #ff779a;
            --pink-soft: #ffd4df;
            --mint: #b8e6bf;
            --shadow: rgba(106, 75, 37, 0.16);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            color: var(--ink);
            background:
                radial-gradient(circle at 18% 12%, rgba(255, 214, 142, 0.34), transparent 30%),
                radial-gradient(circle at 88% 82%, rgba(123, 208, 231, 0.24), transparent 31%),
                #fff8e9;
            font-family: "STKaiti", "KaiTi", "FangSong", serif;
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
        }

        .story-screen,
        .confession-screen {
            position: fixed;
            inset: 0;
            min-height: 100dvh;
        }

        .story-screen {
            z-index: 2;
            display: grid;
            place-items: center;
            padding:
                max(18px, env(safe-area-inset-top))
                16px
                max(18px, env(safe-area-inset-bottom));
            transition: opacity 700ms ease, transform 700ms cubic-bezier(.2, .75, .25, 1);
        }

        .story-screen::before,
        .story-screen::after {
            position: absolute;
            z-index: -1;
            width: 190px;
            height: 190px;
            border: 2px dashed rgba(122, 89, 54, 0.12);
            border-radius: 47% 53% 60% 40%;
            content: "";
            animation: slowSpin 24s linear infinite;
        }

        .story-screen::before {
            top: -72px;
            left: -68px;
        }

        .story-screen::after {
            right: -74px;
            bottom: -82px;
            width: 230px;
            height: 230px;
            animation-direction: reverse;
        }

        .story-screen.is-hidden {
            pointer-events: none;
            opacity: 0;
            transform: scale(1.08);
        }

        .story-card {
            position: relative;
            display: grid;
            grid-template-rows: auto minmax(86px, auto) minmax(0, 1fr) auto auto;
            width: min(94vw, 590px);
            height: min(92dvh, 820px);
            max-height: 920px;
            overflow: hidden;
            background:
                linear-gradient(rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.2)),
                var(--paper);
            border: 1px solid rgba(112, 76, 41, 0.13);
            border-radius: 34px;
            box-shadow:
                0 28px 80px rgba(93, 66, 36, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            isolation: isolate;
        }

        .story-card::before {
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 10% 15%, rgba(96, 67, 40, 0.035) 0 1px, transparent 1.5px),
                radial-gradient(circle at 76% 74%, rgba(96, 67, 40, 0.03) 0 1px, transparent 1.5px);
            background-size: 22px 22px, 28px 28px;
            content: "";
            opacity: 0.75;
        }

        .story-card.is-leaving {
            animation: cardLeave 280ms ease forwards;
        }

        .story-card.is-entering {
            animation: cardEnter 620ms cubic-bezier(.16, .84, .32, 1.18) both;
        }

        .story-card.is-text-only {
            grid-template-rows: auto 0 minmax(0, 1fr) auto auto;
        }

        .story-card.is-text-only .story-copy {
            height: 0;
            min-height: 0;
            padding: 0;
            overflow: hidden;
            visibility: hidden;
        }

        .story-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 28px 8px;
        }

        .story-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 13px;
            color: var(--ink-soft);
            background: #fff3ca;
            border: 1px solid rgba(106, 75, 37, 0.1);
            border-radius: 999px;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 12px;
            letter-spacing: 0.08em;
        }

        .story-label::before {
            width: 8px;
            height: 8px;
            background: var(--pink);
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(255, 119, 154, 0.14);
            content: "";
        }

        .page-number {
            color: #9b8065;
            font-family: Georgia, serif;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.13em;
        }

        .story-copy {
            display: grid;
            place-items: center;
            padding: 8px 34px 4px;
            text-align: center;
        }

        .story-text {
            max-width: 100%;
            margin: 0;
            font-size: clamp(25px, 5.8vw, 38px);
            font-weight: 700;
            line-height: 1.45;
            letter-spacing: 0.04em;
            text-wrap: balance;
            animation: textReveal 620ms 80ms cubic-bezier(.18, .8, .24, 1.08) both;
        }

        .story-stage {
            position: relative;
            min-height: 0;
            margin: 2px 18px 0;
        }

        #sceneArt {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .generated-scene-image {
            animation: generatedImageIn 720ms cubic-bezier(.18, .82, .28, 1.12) both;
            transform-box: fill-box;
            transform-origin: center;
        }

        @keyframes generatedImageIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.93);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .progress {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 22px;
            padding: 4px 24px 10px;
        }

        .progress-dot {
            width: 7px;
            height: 7px;
            padding: 0;
            background: #e5d6c0;
            border: 0;
            border-radius: 99px;
            transition: width 350ms ease, background 350ms ease, transform 350ms ease;
        }

        .progress-dot.is-active {
            width: 24px;
            background: var(--pink);
            transform: scaleY(1.08);
        }

        .button-area {
            padding: 0 28px 26px;
        }

        .story-button {
            position: relative;
            width: 100%;
            min-height: 58px;
            overflow: hidden;
            color: #fff;
            background: linear-gradient(135deg, #ff8ca8, #ff668d);
            border: 0;
            border-radius: 19px;
            box-shadow:
                0 12px 28px rgba(238, 91, 128, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.38);
            cursor: pointer;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 0.05em;
            transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
        }

        .story-button::after {
            position: absolute;
            top: -50%;
            left: -35%;
            width: 30%;
            height: 200%;
            background: rgba(255, 255, 255, 0.26);
            content: "";
            transform: rotate(20deg);
            animation: buttonShine 3.4s 1.2s ease-in-out infinite;
        }

        .story-button:hover {
            filter: saturate(1.08) brightness(1.03);
            box-shadow: 0 15px 34px rgba(238, 91, 128, 0.34);
            transform: translateY(-2px);
        }

        .story-button:active {
            box-shadow: 0 7px 18px rgba(238, 91, 128, 0.24);
            transform: translateY(1px) scale(0.97);
        }

        .story-button:focus-visible {
            outline: 3px solid rgba(255, 102, 141, 0.34);
            outline-offset: 4px;
        }

        .story-button:disabled {
            cursor: default;
            filter: grayscale(0.15);
            opacity: 0.72;
        }

        .tiny-hint {
            margin: 9px 0 0;
            color: #ad9277;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 11px;
            text-align: center;
            letter-spacing: 0.1em;
        }

        /* SVG drawing styles */
        .outline {
            stroke: var(--ink);
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 7;
        }

        .thin-outline {
            stroke: var(--ink);
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-width: 5;
        }

        .tiger-motion {
            animation: breathe 2.8s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center bottom;
        }

        .tiger.walking .tiger-motion {
            animation: walkBob 680ms ease-in-out infinite;
        }

        .tiger.laughing .tiger-motion {
            animation: happyBounce 620ms ease-in-out infinite;
        }

        .tiger.surprised .tiger-motion {
            animation: surprisePop 720ms cubic-bezier(.2, .8, .2, 1.3) both;
        }

        .tail {
            animation: tailWag 1.25s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: left center;
        }

        .eye {
            animation: blink 4.2s infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .fish-tail {
            animation: fishWiggle 900ms ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: left center;
        }

        .wave-line {
            stroke-dasharray: 18 14;
            animation: waveFlow 2.4s linear infinite;
        }

        .palm-leaf {
            animation: palmSway 2.8s ease-in-out infinite alternate;
            transform-box: fill-box;
            transform-origin: right bottom;
        }

        .stall-awning {
            animation: awningSway 2.6s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center top;
        }

        .oyster-pop {
            animation: oysterPop 700ms 120ms cubic-bezier(.16, .84, .25, 1.28) both;
            transform-box: fill-box;
            transform-origin: center bottom;
        }

        .shell-top {
            animation: shellOpen 1.1s 260ms cubic-bezier(.2, .8, .3, 1.1) both;
            transform-box: fill-box;
            transform-origin: center bottom;
        }

        .bag-pop {
            animation: bagPop 850ms 700ms cubic-bezier(.18, .84, .25, 1.26) both;
            transform-box: fill-box;
            transform-origin: center bottom;
        }

        .svg-heart {
            animation: heartBeat 1.15s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .svg-heart.delay-1 {
            animation-delay: 180ms;
        }

        .svg-heart.delay-2 {
            animation-delay: 360ms;
        }

        .sound-ring {
            animation: soundRing 1.6s ease-out infinite;
            transform-box: fill-box;
            transform-origin: center;
        }

        .sound-ring.delay {
            animation-delay: 520ms;
        }

        .final-word {
            animation: finalWord 780ms cubic-bezier(.16, .84, .25, 1.25) both;
            transform-box: fill-box;
            transform-origin: center;
        }

        /* Final confession screen */
        .confession-screen {
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
            opacity: 0;
            background:
                radial-gradient(circle at 50% 44%, rgba(255, 255, 255, 0.96), transparent 27%),
                radial-gradient(circle at 15% 16%, rgba(255, 214, 224, 0.86), transparent 34%),
                radial-gradient(circle at 86% 84%, rgba(255, 231, 193, 0.7), transparent 34%),
                #fff7f4;
            transition: opacity 900ms ease;
        }

        .confession-screen.is-visible {
            z-index: 5;
            pointer-events: auto;
            opacity: 1;
        }

        .confession-screen::before {
            position: absolute;
            inset: -40%;
            background: conic-gradient(
                from 45deg,
                transparent,
                rgba(255, 135, 168, 0.09),
                transparent 30%,
                rgba(255, 209, 128, 0.08),
                transparent 65%
            );
            content: "";
            animation: slowSpin 26s linear infinite;
        }

        .confession-center {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 1;
            width: min(78vw, 470px);
            text-align: center;
            transform: translate(-50%, -50%);
        }

        .confession-kicker {
            margin: 0 0 12px;
            color: #b58d81;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 13px;
            letter-spacing: 0.28em;
            opacity: 0;
        }

        .confession-title {
            margin: 0;
            color: #ef5d83;
            font-size: clamp(42px, 12vw, 78px);
            line-height: 1.15;
            letter-spacing: 0.04em;
            text-shadow: 0 10px 28px rgba(239, 93, 131, 0.18);
            opacity: 0;
        }

        .confession-screen.is-visible .confession-kicker {
            animation: textReveal 700ms 600ms ease both;
        }

        .confession-screen.is-visible .confession-title {
            animation: finalReveal 1s 800ms cubic-bezier(.16, .84, .25, 1.24) both;
        }

        .popup-container {
            position: absolute;
            inset: 0;
            z-index: 2;
            overflow: hidden;
            pointer-events: none;
        }

        .popup {
            position: absolute;
            left: var(--x);
            top: var(--y);
            max-width: 46vw;
            padding: 10px 17px;
            color: #fff;
            background: linear-gradient(135deg, hsl(var(--hue) 90% 76%), hsl(var(--hue) 84% 65%));
            border: 1px solid rgba(255, 255, 255, 0.58);
            border-radius: 16px 16px 16px 5px;
            box-shadow:
                0 10px 26px rgba(202, 76, 111, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.42);
            font-family: "Microsoft YaHei", sans-serif;
            font-size: var(--size);
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            transform: translate(-50%, -50%) rotate(var(--rotate)) scale(0.4);
            animation: popupFloat var(--duration) var(--delay) cubic-bezier(.18, .82, .22, 1) forwards;
        }

        .popup::after {
            position: absolute;
            right: -5px;
            bottom: -8px;
            color: hsl(var(--hue) 84% 65%);
            content: "♥";
            font-size: 17px;
            text-shadow: 0 2px 4px rgba(202, 76, 111, 0.15);
        }

        .replay-button {
            position: absolute;
            right: max(18px, env(safe-area-inset-right));
            bottom: max(18px, env(safe-area-inset-bottom));
            z-index: 4;
            padding: 10px 15px;
            color: #a87380;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(198, 120, 140, 0.18);
            border-radius: 999px;
            backdrop-filter: blur(12px);
            cursor: pointer;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 12px;
            opacity: 0;
            transition: transform 160ms ease, background 160ms ease;
        }

        .confession-screen.is-visible .replay-button {
            animation: textReveal 650ms 2.4s ease forwards;
        }

        .replay-button:hover {
            background: rgba(255, 255, 255, 0.94);
            transform: translateY(-2px);
        }

        @keyframes cardLeave {
            to { opacity: 0; transform: translateX(-28px) rotate(-0.8deg); }
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateX(30px) rotate(0.8deg); }
            to { opacity: 1; transform: translateX(0) rotate(0); }
        }

        @keyframes textReveal {
            from { opacity: 0; transform: translateY(-13px); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        @keyframes breathe {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-4px) scale(1.018, 0.99); }
        }

        @keyframes walkBob {
            0%, 100% { transform: translateY(0) rotate(-1deg); }
            50% { transform: translateY(-9px) rotate(1deg); }
        }

        @keyframes happyBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            45% { transform: translateY(-14px) scale(1.03, 0.97); }
            70% { transform: translateY(2px) scale(0.98, 1.03); }
        }

        @keyframes surprisePop {
            from { transform: translateY(32px) scale(0.78); opacity: 0; }
            65% { transform: translateY(-8px) scale(1.05); opacity: 1; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        @keyframes tailWag {
            0%, 100% { transform: rotate(-7deg); }
            50% { transform: rotate(13deg); }
        }

        @keyframes blink {
            0%, 43%, 47%, 100% { transform: scaleY(1); }
            45% { transform: scaleY(0.08); }
        }

        @keyframes fishWiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(9deg); }
        }

        @keyframes waveFlow {
            to { stroke-dashoffset: -64; }
        }

        @keyframes palmSway {
            from { transform: rotate(-3deg); }
            to { transform: rotate(4deg); }
        }

        @keyframes awningSway {
            0%, 100% { transform: skewX(0); }
            50% { transform: skewX(-1.8deg); }
        }

        @keyframes oysterPop {
            from { opacity: 0; transform: translateY(48px) scale(0.55) rotate(-8deg); }
            70% { opacity: 1; transform: translateY(-7px) scale(1.06) rotate(2deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }

        @keyframes shellOpen {
            from { transform: rotate(0deg) translateY(38px); }
            to { transform: rotate(-8deg) translateY(-48px); }
        }

        @keyframes bagPop {
            from { opacity: 0; transform: translateY(28px) scale(0.35) rotate(8deg); }
            to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(0.88) rotate(-4deg); }
            50% { transform: scale(1.16) rotate(4deg); }
        }

        @keyframes soundRing {
            from { opacity: 0.85; transform: scale(0.7); }
            to { opacity: 0; transform: scale(1.24); }
        }

        @keyframes finalWord {
            from { opacity: 0; transform: scale(0.55) rotate(-3deg); }
            72% { opacity: 1; transform: scale(1.08) rotate(1deg); }
            to { opacity: 1; transform: scale(1) rotate(0); }
        }

        @keyframes buttonShine {
            0%, 68% { left: -35%; }
            100% { left: 125%; }
        }

        @keyframes popupFloat {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) rotate(var(--rotate)) scale(0.4);
            }
            13% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(var(--rotate)) scale(1.06);
            }
            20%, 76% {
                opacity: 1;
                transform: translate(-50%, -50%) rotate(var(--rotate)) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(-50%, calc(-50% - 44px)) rotate(calc(var(--rotate) + 3deg)) scale(1.16);
            }
        }

        @keyframes finalReveal {
            from { opacity: 0; transform: scale(0.55) rotate(-4deg); filter: blur(8px); }
            72% { opacity: 1; transform: scale(1.06) rotate(1deg); filter: blur(0); }
            to { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
        }

        @keyframes slowSpin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 520px) {
            .story-card {
                width: min(95vw, 590px);
                height: min(91dvh, 820px);
                border-radius: 27px;
            }

            .story-topbar {
                padding: 20px 20px 5px;
            }

            .story-copy {
                padding-right: 22px;
                padding-left: 22px;
            }

            .button-area {
                padding: 0 20px 20px;
            }

            .story-stage {
                margin-right: 8px;
                margin-left: 8px;
            }
        }

        @media (max-height: 700px) {
            .story-card {
                height: 96dvh;
                grid-template-rows: auto minmax(58px, auto) minmax(0, 1fr) auto auto;
            }

            .story-topbar {
                padding-top: 14px;
            }

            .story-text {
                font-size: clamp(20px, 4.8vw, 30px);
            }

            .story-button {
                min-height: 48px;
            }

            .button-area {
                padding-bottom: 12px;
            }

            .tiny-hint {
                display: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="story-screen" id="storyScreen">
        <article class="story-card" id="storyCard" aria-live="polite">
            <header class="story-topbar">
                <span class="story-label">给卢宝的小故事</span>
                <span class="page-number" id="pageNumber">01 / 08</span>
            </header>

            <div class="story-copy">
                <h1 class="story-text" id="storyText"></h1>
            </div>

            <div class="story-stage" aria-hidden="true">
                <svg id="sceneArt" viewBox="0 0 800 590" role="img"></svg>
            </div>

            <nav class="progress" id="progress" aria-label="故事进度"></nav>

            <div class="button-area">
                <button class="story-button" id="storyButton" type="button"></button>
                <p class="tiny-hint">轻轻点一下，故事就会继续</p>
            </div>
        </article>
    </main>

    <section class="confession-screen" id="confessionScreen" aria-hidden="true">
        <div class="confession-center">
            <p class="confession-kicker">故事讲完啦</p>
            <h2 class="confession-title">我想你了！</h2>
        </div>
        <div class="popup-container" id="popupContainer"></div>
        <button class="replay-button" id="replayButton" type="button">再看一遍故事</button>
    </section>

    <script>
        'use strict';

        const storyScreen = document.getElementById('storyScreen');
        const confessionScreen = document.getElementById('confessionScreen');
        const storyCard = document.getElementById('storyCard');
        const storyText = document.getElementById('storyText');
        const storyButton = document.getElementById('storyButton');
        const pageNumber = document.getElementById('pageNumber');
        const progress = document.getElementById('progress');
        const sceneArt = document.getElementById('sceneArt');
        const popupContainer = document.getElementById('popupContainer');
        const replayButton = document.getElementById('replayButton');

        let currentScene = 0;
        let isChanging = false;
        let popupTimer = null;

        function svgDefs() {
            return `
                <defs>
                    <linearGradient id="seaGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#9ae0ef"/>

                <path class="svg-heart" d="M208 255 C185 230 147 263 208 312 C269 263 231 230 208 255 Z" fill="#ff9bad"/>
                <path class="svg-heart delay-1" d="M604 226 C582 202 547 234 604 278 C661 234 626 202 604 226 Z" fill="#f88ca6"/>
                <path class="svg-heart delay-2" d="M649 310 C638 298 620 315 649 337 C678 315 660 298 649 310 Z" fill="#ffb5c3"/>
            `;
        }

        function sceneSix() {
            return `${svgDefs()}
                ${referenceTigerHead(400, 338, 1.55)}
            `;
        }

        function sceneSeven() {
            return `${svgDefs()}
                <text x="400" y="315" text-anchor="middle" fill="#2d2925" font-size="50" font-family="KaiTi, STKaiti, serif" font-weight="700">“耗像包包，耗像包包啊！”</text>
            `;
        }

        function sceneEight() {
            return `${svgDefs()}
                <g class="final-word">
                    <text x="400" y="315" text-anchor="middle" fill="#2d2925" font-size="50" font-family="KaiTi, STKaiti, serif" font-weight="700">“好想宝宝，好想宝宝啊！”</text>
                    <path class="svg-heart" d="M491 242 C476 224 450 248 491 280 C532 248 506 224 491 242 Z" fill="#f37596"/>
                    <path class="svg-heart delay-1" d="M541 261 C531 249 513 265 541 287 C569 265 551 249 541 261 Z" fill="#ec6f91"/>
                </g>
            `;
        }

        function generatedSceneImage(src, label) {
            return `
                <image
                    class="generated-scene-image"
                    href="${src}"
                    x="40"
                    y="-10"
                    width="720"
                    height="620"
                    preserveAspectRatio="xMidYMid meet"
                    role="img"
                    aria-label="${label}"
                />
            `;
        }

        const scenes = [
            {
                text: '从前有个渔民',
                button: '故事开始啦 ✨',
                draw: () => generatedSceneImage('assets/scene-01-tiger-fish.webp', '抱着蓝色小鱼的可爱小老虎')
            },
            {
                text: '它们家以卖海鲜为生',
                button: '后来呢？',
                draw: () => generatedSceneImage('assets/scene-02-seafood-stall.webp', '蓝白色遮棚的海鲜小摊')
            },
            {
                text: '有一天它要去海边捡海鲜',
                button: '去海边看看 🌊',
                draw: () => generatedSceneImage('assets/scene-03-beach.webp', '提着贝壳篮子来到海边的小老虎')
            },
            {
                text: '捡着捡着它突然发现有一个生蚝',
                button: '发现什么啦？',
                draw: () => generatedSceneImage('assets/scene-04-oyster-discovery.webp', '小老虎惊喜地发现一个生蚝')
            },
            {
                text: '生蚝的形状特别像一个可爱的小包包',
                button: '打开看看 🐚',
                draw: () => generatedSceneImage('assets/scene-05-oyster-bag.webp', '打开的生蚝里有一个可爱小包包')
            },
            {
                text: '随后它开心的喊：',
                button: '它说了什么？',
                draw: () => generatedSceneImage('assets/scene-06-laughing-tiger.webp', '开心大笑的小老虎头像')
            },
            {
                text: '“耗像包包，耗像包包啊！”',
                button: '再点一下嘛 ♡',
                textOnly: true,
                draw: sceneSeven
            },
            {
                text: '“好想宝宝，好想宝宝啊！”',
                button: '想卢宝了 💗',
                textOnly: true,
                draw: sceneEight
            }
        ];

        [
            'assets/scene-01-tiger-fish.webp',
            'assets/scene-02-seafood-stall.webp',
            'assets/scene-03-beach.webp',
            'assets/scene-04-oyster-discovery.webp',
            'assets/scene-05-oyster-bag.webp',
            'assets/scene-06-laughing-tiger.webp'
        ].forEach((src) => {
            const image = new Image();
            image.decoding = 'async';
            image.src = src;
        });

        function renderProgress(index) {
            progress.innerHTML = scenes.map((_, dotIndex) => {
                const activeClass = dotIndex === index ? ' is-active' : '';
                return `<span class="progress-dot${activeClass}" aria-hidden="true"></span>`;
            }).join('');
        }

        function renderScene(index) {
            const scene = scenes[index];
            storyCard.classList.toggle('is-text-only', Boolean(scene.textOnly));
            storyText.textContent = scene.text;
            storyButton.textContent = scene.button;
            pageNumber.textContent = `${String(index + 1).padStart(2, '0')} / ${String(scenes.length).padStart(2, '0')}`;
            sceneArt.innerHTML = scene.draw();
            sceneArt.setAttribute('aria-label', `故事第${index + 1}幕：${scene.text}`);
            renderProgress(index);

            storyText.style.animation = 'none';
            void storyText.offsetWidth;
            storyText.style.animation = '';
        }

        function goToNextScene() {
            if (isChanging) {
                return;
            }

            if (currentScene === scenes.length - 1) {
                startConfession();
                return;
            }

            isChanging = true;
            storyButton.disabled = true;
            storyCard.classList.remove('is-entering');
            storyCard.classList.add('is-leaving');

            window.setTimeout(() => {
                currentScene += 1;
                renderScene(currentScene);
                storyCard.classList.remove('is-leaving');
                storyCard.classList.add('is-entering');

                window.setTimeout(() => {
                    storyCard.classList.remove('is-entering');
                    storyButton.disabled = false;
                    isChanging = false;
                }, 620);
            }, 280);
        }

        function randomBetween(min, max) {
            return Math.random() * (max - min) + min;
        }

        function createPopup(isOpeningBurst = false) {
            const popup = document.createElement('div');
            popup.className = 'popup';
            popup.textContent = '我想你了！';
            popup.style.setProperty('--x', `${randomBetween(7, 93).toFixed(2)}%`);
            popup.style.setProperty('--y', `${randomBetween(8, 92).toFixed(2)}%`);
            popup.style.setProperty('--size', `${randomBetween(14, 23).toFixed(1)}px`);
            popup.style.setProperty('--rotate', `${randomBetween(-8, 8).toFixed(1)}deg`);
            popup.style.setProperty('--hue', `${randomBetween(338, 357).toFixed(0)}`);
            popup.style.setProperty('--duration', `${randomBetween(3.8, 6.2).toFixed(2)}s`);
            popup.style.setProperty('--delay', `${isOpeningBurst ? randomBetween(0, 0.7) : 0}s`);
            popupContainer.appendChild(popup);
            popup.addEventListener('animationend', () => popup.remove(), { once: true });
        }

        function startPopupRain() {
            for (let i = 0; i < 18; i += 1) {
                createPopup(true);
            }

            popupTimer = window.setInterval(() => createPopup(false), 145);
        }

        function startConfession() {
            if (isChanging || confessionScreen.classList.contains('is-visible')) {
                return;
            }

            isChanging = true;
            storyButton.disabled = true;
            storyScreen.classList.add('is-hidden');
            confessionScreen.classList.add('is-visible');
            confessionScreen.setAttribute('aria-hidden', 'false');
            window.setTimeout(startPopupRain, 500);
        }

        function replayStory() {
            if (popupTimer !== null) {
                window.clearInterval(popupTimer);
                popupTimer = null;
            }

            popupContainer.replaceChildren();
            confessionScreen.classList.remove('is-visible');
            confessionScreen.setAttribute('aria-hidden', 'true');
            storyScreen.classList.remove('is-hidden');
            currentScene = 0;
            isChanging = false;
            storyButton.disabled = false;
            renderScene(currentScene);
            storyCard.classList.add('is-entering');
            window.setTimeout(() => storyCard.classList.remove('is-entering'), 620);
        }

        storyButton.addEventListener('click', goToNextScene);
        replayButton.addEventListener('click', replayStory);

        document.addEventListener('keydown', (event) => {
            if ((event.key === 'Enter' || event.key === 'ArrowRight') && !confessionScreen.classList.contains('is-visible')) {
                goToNextScene();
            }
        });

        renderScene(currentScene);
    </script>
</body>
</html>
